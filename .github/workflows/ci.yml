name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Build
        run: make

      - name: Unit tests
        run: make test

      - name: Fuzz and property tests (AddressSanitizer + UBSan)
        run: make fuzz FUZZ_ITERS=50000 FUZZ_SEED=1
